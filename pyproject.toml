[project]
name = "forkbench"
version = "0.1.0"
description = "Build once, fork many: measure how fast RL task environments reset on Runta (scratch vs checkpoint)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "runta-sdk==0.2.1",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
]

[project.scripts]
forkbench = "forkbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forkbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: imports, B: bugbear, UP: modern syntax, S: bandit security checks, ASYNC: asyncio pitfalls
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "E501",     # line width is enforced by `ruff format`; long strings/docstrings are allowed
    "ASYNC109", # our `timeout` params are forwarded to Runta's server-side exec timeout, not awaited locally
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108", "ASYNC110"]  # asserts, fake tokens, fake remote paths, test polling

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/forkbench"]

[[tool.mypy.overrides]]
module = ["runta", "runta.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: talks to the real Runta API and spends a few cents of credit (opt-in: FORKBENCH_LIVE=1)"]
